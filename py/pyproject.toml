[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# F: Pyflakes (Bugs)
# E, W: Pycodestyle (Erros/Avisos de estilo)
# I: isort (Imports ordenados)
# UP: pyupgrade (Força sintaxe moderna do Python)
# S: flake8-bandit (Varredura de segurança/vulnerabilidades)
# B: flake8-bugbear (Padrões de design propensos a bugs)
select = ["B", "E", "F", "I", "S", "UP", "W"]

# Ignora avisos de strings de conexão de teste (falsos positivos de segurança)
ignore = ["S101"] 

[tool.ruff.lint.isort]
combine-as-imports = true
